<svg width="560" height="420" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <circle cx="460" cy="60" r="80" fill="#EFF6FF" opacity="0.7"/>
  <circle cx="80" cy="340" r="60" fill="#EFF6FF" opacity="0.5"/>

  <!-- Desk/table -->
  <rect x="100" y="310" width="360" height="12" rx="6" fill="#CBD5E1"/>
  <rect x="120" y="322" width="8" height="60" rx="4" fill="#94A3B8"/>
  <rect x="432" y="322" width="8" height="60" rx="4" fill="#94A3B8"/>

  <!-- Laptop body -->
  <rect x="150" y="200" width="260" height="110" rx="8" fill="#1E293B"/>
  <rect x="158" y="206" width="244" height="96" rx="4" fill="#1E40AF"/>

  <!-- Laptop screen content -->
  <rect x="170" y="218" width="80" height="8" rx="4" fill="#60A5FA"/>
  <rect x="170" y="234" width="60" height="6" rx="3" fill="#93C5FD" opacity="0.6"/>
  <rect x="170" y="248" width="70" height="6" rx="3" fill="#93C5FD" opacity="0.6"/>
  <rect x="170" y="262" width="50" height="6" rx="3" fill="#93C5FD" opacity="0.6"/>

  <!-- Chart bars on screen -->
  <rect x="280" y="268" width="16" height="24" rx="3" fill="#34D399"/>
  <rect x="302" y="252" width="16" height="40" rx="3" fill="#60A5FA"/>
  <rect x="324" y="240" width="16" height="52" rx="3" fill="#818CF8"/>
  <rect x="346" y="256" width="16" height="36" rx="3" fill="#F59E0B"/>
  <rect x="368" y="228" width="16" height="64" rx="3" fill="#2563EB"/>

  <!-- Checkmark badge on screen -->
  <circle cx="192" cy="282" r="10" fill="#10B981"/>
  <path d="M187 282L190 285L197 278" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person - body -->
  <circle cx="420" cy="145" r="32" fill="#FBBF24"/>
  <!-- Hair -->
  <path d="M388 140C388 118 402 105 420 105C438 105 452 118 452 140" fill="#1E293B"/>
  <!-- Face -->
  <circle cx="410" cy="148" r="2.5" fill="#1E293B"/>
  <circle cx="430" cy="148" r="2.5" fill="#1E293B"/>
  <path d="M414 158C416 162 424 162 426 158" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

  <!-- Person - torso -->
  <path d="M395 177C395 177 400 195 400 220L440 220C440 195 445 177 445 177C445 177 435 170 420 170C405 170 395 177 395 177Z" fill="#2563EB"/>

  <!-- Person - arms -->
  <path d="M395 185L360 220L370 225" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M445 185L460 210" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hands -->
  <circle cx="360" cy="222" r="8" fill="#FBBF24"/>
  <circle cx="462" cy="212" r="8" fill="#FBBF24"/>

  <!-- Floating elements -->
  <!-- Document card -->
  <rect x="60" y="120" width="90" height="110" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="74" y="136" width="50" height="6" rx="3" fill="#2563EB"/>
  <rect x="74" y="150" width="62" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="74" y="160" width="55" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="74" y="170" width="48" height="4" rx="2" fill="#CBD5E1"/>
  <circle cx="100" cy="205" r="12" fill="#DBEAFE"/>
  <path d="M95 205L99 209L107 200" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating badge - top right -->
  <rect x="440" y="80" width="100" height="40" rx="20" fill="white" stroke="#E2E8F0" stroke-width="1.5">
    <animate attributeName="y" values="80;72;80" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="462" cy="100" r="10" fill="#10B981">
    <animate attributeName="cy" values="100;92;100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M457 100L460 103L467 96" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="transform" values="translate(0,0);translate(0,-8);translate(0,0)" dur="3s" repeatCount="indefinite"/>
  </path>
  <rect x="478" y="94" width="50" height="6" rx="3" fill="#CBD5E1">
    <animate attributeName="y" values="94;86;94" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="478" y="104" width="35" height="4" rx="2" fill="#E2E8F0">
    <animate attributeName="y" values="104;96;104" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating search icon -->
  <circle cx="80" cy="80" r="22" fill="white" stroke="#E2E8F0" stroke-width="1.5">
    <animate attributeName="cy" values="80;88;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="76" cy="76" r="8" stroke="#2563EB" stroke-width="2.5" fill="none">
    <animate attributeName="cy" values="76;84;76" dur="4s" repeatCount="indefinite"/>
  </circle>
  <line x1="82" y1="82" x2="90" y2="90" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round">
