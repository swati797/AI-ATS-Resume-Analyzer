    <animate attributeName="y2" values="90;98;90" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Stars/sparkle -->
  <circle cx="170" cy="160" r="3" fill="#F59E0B"/>
  <circle cx="500" cy="300" r="3" fill="#2563EB"/>
  <circle cx="130" cy="280" r="2" fill="#8B5CF6"/>

  <!-- Plant decoration -->
  <rect x="480" y="290" width="6" height="22" rx="3" fill="#10B981"/>
  <circle cx="483" cy="282" r="12" fill="#34D399"/>
  <circle cx="470" cy="288" r="8" fill="#6EE7B7"/>
  <circle cx="495" cy="286" r="9" fill="#6EE7B7"/>
  <rect x="478" y="310" width="10" height="6" rx="2" fill="#CBD5E1"/>
